name: Secure DevSecops Pipeline

on:
 push:
   branches:
     - master
   workflow_dispatch:

 jobs:
   build:
     runs-on: self hosted

 steps:
   - name: checkout code
     uses: actions/checkout@v4

   - name: Cache Dependencies
     uses: actions/cache@v5
     with:
       path: ~/.npm
       key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

   - name: Build
     run: npm install

   - name: Test
     run: echo "Code is tested"

   - name: deploy
     run: echo "code is deployed"
      
  
  

   
  
