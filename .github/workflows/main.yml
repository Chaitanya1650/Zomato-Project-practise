name: Pratice Pipeline

on:
 push:
   branches:
     - master
 workflow_dispatch:
 
jobs:
   build_and_package:
   name: BUILD-JOB
   if: github.ref == 'refs/heads/master' && github.event_name == 'push'
   runs-on: ${{ matrix.os }}

strategy:
   matrix:

     os:
      - ubuntu-slim
      - ubuntu-latest

     node-version:
      - 18
      - 20
      - 22

     language:
      - javascript-typescript


permissions:
   actions: read
   contents: read
   security-events: write

steps:

   - name: checkout code
     uses: actions/checkout@v4

   - name: Setup node.js
     uses: actions/setup-node@v4
     with:
       node-version: ${{ matrix.node-version }}

   - name: Cache Dependencies
     uses: actions/cache@v5
     with:
       path: ~/.npm
       keys: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
       restore-keys:
         ${{ runner.os }}-node-${{ matrix.node-version }}

   - name: Initilaze CodeQL
     uses: github/codeql-action/init@v4
     with:
        language: ${{ matrix.language }}

   - name: Autobuild
     uses: github/codeql-action/autobuild@v4

   - name: CodeQL Analysis
     uses: github/codeql-action/analyze@v4
     with:
       category: "/language:${{ matrix.language }}"
       
   - name: Install Dependencies
     run: npm install

   - name: Test
     run: echo "Code is tested"

   - name: Artifact Upload
      uses: actions/upload-artifact@v7
      name: artifact-${{ runner.os }}-node-${{ matrix.node-version }}
      path: |
        package*

   - name: Deploy
     run: echo "Code is Deployed"

   - name: Rollback
     if: failure()
     run: echo "rollback is done"


n\
