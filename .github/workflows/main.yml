name: Demo Pipeline

on:
 push:
   branches:
     - master
 workflow_dispatch:
   inputs:
     environment:
       description: 'Select Environment'
       required: true
       type: choice
       options:
         - dev
         - test
         - prod
         
     username:
       description: 'Enter Username:'
       required: true
       type: string

jobs:
  demo:
    runs-on: ubuntu-slim

    steps:
      - name: Display Inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Username: ${{ inputs.username }}"
    
