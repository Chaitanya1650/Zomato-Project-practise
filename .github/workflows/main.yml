name: Job Output Demo

on:
 push:
   branches:
     - master
 workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest

    outputs:
      app_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate Version
        id: version
        run: |
          echo "version=2.5.0" >> $GITHUB_OUTPUT

  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Read Job Output
        run: |
          echo "Application Version: ${{ needs.job1.outputs.app_version }}"
