name: Secure DevSecOps Pipeline 

on: 
 push: 
   branches: 
     - master 
 workflow_dispatch: 
inputs:
    username:
      description: "Enter username"
      required: true
      type: string

    environment:
      description: "Select environment"
      required: true
      type: choice
      options:
        - dev
        - staging
        - production

    deploy:
      description: "Deploy?"
      required: true
      type: boolean
